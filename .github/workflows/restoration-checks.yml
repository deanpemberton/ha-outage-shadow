name: Python restoration evidence checks
on:
  push:
  pull_request:
jobs:
  pure-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax-check custom integration
        run: python -m compileall -q custom_components
      - name: Run restoration regression checks
        run: python -m unittest discover -s tests -p 'test_restoration.py' -v
