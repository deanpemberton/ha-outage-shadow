name: Validate HACS integration
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: python -m compileall -q custom_components/we_outage_shadow
      - name: Validate JSON metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for file in ["hacs.json", "custom_components/we_outage_shadow/manifest.json", "custom_components/we_outage_shadow/strings.json"]:
              json.loads(Path(file).read_text())
          PY
      - name: Test local energy and forecast engine
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          root = Path("custom_components/we_outage_shadow")
          for name in ("energy.py", "forecast.py"):
              ast.parse((root / name).read_text())
          from importlib.util import spec_from_file_location, module_from_spec
          spec = spec_from_file_location("energy_engine", root / "energy.py")
          module = module_from_spec(spec)
          import sys
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          battery = module.Battery(13.5, 0.6, 0.05)
          result = module.simulate(battery, [module.Interval(1, 0, 0.5)])
          assert result.survived is True
          assert result.final_soc_fraction < 0.6
          PY
